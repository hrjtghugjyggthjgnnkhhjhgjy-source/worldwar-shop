<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World War | War Room</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            background-color: #060910;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .loader-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            width: 100%;
            max-width: 500px; /* همون سایز بنر سایت */
            padding: 0 20px;
            box-sizing: border-box;
        }

        /* 👇 کل عکس با کیفیت و بدون بریدگی */
        .loader-logo {
            width: 100%;
            height: auto;
            border-radius: 16px; /* گوشه‌های گرد مثل بنر سایت */
            border: 3px solid #d4af37;
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.6);
            animation: pulse 1.5s infinite;
            display: block;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }
            50% { transform: scale(1.02); box-shadow: 0 0 45px rgba(212, 175, 55, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }
        }

        /* دایره چرخان */
        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(212, 175, 55, 0.2);
            border-top: 4px solid #d4af37;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* متن لودینگ */
        .loading-text {
            color: #8b949e;
            font-size: 1.1rem;
            font-weight: bold;
            margin: 0;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div class="loader-container">
        <!-- 👇 کل عکس اینجا نمایش داده میشه -->
        <img src="https://uploadkon.ir/uploads/5e4d23_26file-00000000922c8246908a4987443fcf6c.png" alt="World War" class="loader-logo">
        
        <div class="spinner"></div>
        
        <h2 class="loading-text">در حال آماده‌سازی میدان نبرد...</h2>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg) {
            tg.expand(); 
            tg.setHeaderColor('#060910'); 
            tg.setBackgroundColor('#060910');
        }

        // بعد از ۳ ثانیه، کاربر رو می‌فرستیم به سایت اصلی (index.html)
        setTimeout(function() {
            window.location.href = 'index.html';
        }, 3000);
    </script>

</body>
</html>
