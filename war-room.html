<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World War | War Room</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .loader-wrapper {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* محتوا رو میبره پایین */
            align-items: center;
            padding-bottom: 50px; /* فاصله از پایین */
            box-sizing: border-box;
        }

        /* عکس پس‌زمینه (کامل و پوشش کل صفحه) */
        .bg-image {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://uploadkon.ir/uploads/5e4d23_26file-00000000922c8246908a4987443fcf6c.png');
            background-size: cover; /* پر کردن کل صفحه */
            background-position: center;
            animation: zoomIn 15s ease-out forwards; /* زوم آرام سینمایی */
            z-index: 1;
        }

        @keyframes zoomIn {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        /* لایه تیره برای اینکه متن‌ها دیده بشن */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.2) 0%, rgba(0, 0, 0, 0.9) 100%);
            z-index: 2;
        }

        /* محتوای لودینگ */
        .content {
            position: relative;
            z-index: 3;
            text-align: center;
            width: 100%;
            max-width: 400px;
            padding: 0 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .loading-text {
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* نوار لودینگ طلایی */
        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #b8860b, #d4af37, #ffd700);
            border-radius: 10px;
            animation: loadProgress 3s ease-in-out forwards;
            box-shadow: 0 0 10px #d4af37;
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            50% { width: 60%; }
            100% { width: 100%; }
        }

        /* لوگوی کوچیک بالای نوار (اختیاری) */
        .logo-text {
            color: #d4af37;
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }

    </style>
</head>
<body>

    <div class="loader-wrapper">
        <!-- عکس پس‌زمینه با زوم سینمایی -->
        <div class="bg-image"></div>
        <!-- لایه تیره -->
        <div class="overlay"></div>

        <!-- محتوا (پایین صفحه) -->
        <div class="content">
            <div class="logo-text">⚜️ WORLD WAR ⚜️</div>
            <h2 class="loading-text">در حال آماده‌سازی میدان نبرد...</h2>
            
            <div class="progress-bar-container">
                <div class="progress-bar"></div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg) {
            tg.expand(); 
            tg.setHeaderColor('#000000'); 
            tg.setBackgroundColor('#000000');
        }

        // بعد از ۳ ثانیه، میره به سایت اصلی
        setTimeout(function() {
            window.location.href = 'index.html';
        }, 3000);
    </script>

</body>
</html>
