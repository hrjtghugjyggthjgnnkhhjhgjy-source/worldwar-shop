<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World War | War Room</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            background-color: #060910; /* پس زمینه تیره */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .loader-wrapper {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* 👇 تگ گل طلایی با انیمیشن درخشش */
        .logo-tag {
            font-size: 5rem; /* سایز بزرگ */
            color: #d4af37; /* رنگ طلایی */
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.8), 0 0 40px rgba(212, 175, 55, 0.4);
            animation: pulseGlow 2s infinite alternate; /* انیمیشن نور */
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); text-shadow: 0 0 20px rgba(212, 175, 55, 0.6), 0 0 40px rgba(212, 175, 55, 0.2); }
            100% { transform: scale(1.1); text-shadow: 0 0 30px rgba(212, 175, 55, 1), 0 0 60px rgba(212, 175, 55, 0.6); }
        }

        /* متن WORLD WAR */
        .logo-text {
            color: #ffffff;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 3px;
            margin: 0;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        /* نوار لودینگ */
        .progress-bar-container {
            width: 200px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
            margin-top: 10px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #b8860b, #d4af37, #ffd700);
            border-radius: 10px;
            animation: loadProgress 3s ease-in-out forwards;
            box-shadow: 0 0 10px #d4af37;
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            50% { width: 60%; }
            100% { width: 100%; }
        }

        /* متن لودینگ */
        .loading-text {
            color: #8b949e;
            font-size: 0.9rem;
            font-weight: bold;
            margin: 0;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

    </style>
</head>
<body>

    <div class="loader-wrapper">
        <!-- فقط تگ و متن -->
        <div class="logo-tag">⚜️</div>
        <h1 class="logo-text">WORLD WAR</h1>
        
        <!-- نوار و متن لودینگ -->
        <div class="progress-bar-container">
            <div class="progress-bar"></div>
        </div>
        <h2 class="loading-text">در حال آماده‌سازی میدان نبرد...</h2>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg) {
            tg.expand(); 
            tg.setHeaderColor('#060910'); 
            tg.setBackgroundColor('#060910');
        }

        // بعد از ۳ ثانیه، میره به سایت اصلی
        setTimeout(function() {
            window.location.href = 'index.html';
        }, 3000);
    </script>

</body>
</html>
