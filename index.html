<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World War</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, sans-serif; }
body { background: #0a0a0a; color: #fff; min-height: 100vh; }

/* ============ اسپلش ============ */
.splash {
position: fixed; top: 0; left: 0; width: 100%; height: 100%;
background: #0a0a0a;
display: flex; flex-direction: column; align-items: center; justify-content: center;
z-index: 9999; transition: opacity 0.8s; overflow: hidden;
}
.splash.hide { opacity: 0; pointer-events: none; }
.particles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
.particle {
position: absolute; width: 4px; height: 4px; background: #d4af37;
border-radius: 50%; opacity: 0; animation: float 4s infinite; box-shadow: 0 0 10px #d4af37;
}
@keyframes float {
0% { opacity: 0; transform: translateY(0) scale(0); }
20% { opacity: 1; }
100% { opacity: 0; transform: translateY(-100vh) scale(1); }
}
.particle:nth-child(1) { left: 10%; animation-delay: 0s; }
.particle:nth-child(2) { left: 25%; animation-delay: 0.5s; }
.particle:nth-child(3) { left: 40%; animation-delay: 1s; }
.particle:nth-child(4) { left: 55%; animation-delay: 1.5s; }
.particle:nth-child(5) { left: 70%; animation-delay: 2s; }
.particle:nth-child(6) { left: 85%; animation-delay: 2.5s; }
.particle:nth-child(7) { left: 15%; animation-delay: 3s; }
.particle:nth-child(8) { left: 60%; animation-delay: 3.5s; }
.particle:nth-child(9) { left: 90%; animation-delay: 4s; }
.splash-logo { font-size: 80px; color: #d4af37; text-shadow: 0 0 15px rgba(212, 175, 55, 0.4); margin-bottom: 20px; position: relative; z-index: 2; }
.splash-title { font-family: 'Cinzel', serif; font-size: 32px; font-weight: 900; color: #d4af37; letter-spacing: 4px; margin-bottom: 15px; position: relative; z-index: 2; }
.splash-subtitle { color: #888; font-size: 14px; margin-bottom: 40px; position: relative; z-index: 2; }
.splash-percent { color: #d4af37; font-size: 18px; font-weight: bold; position: relative; z-index: 2; }

/* ============ ساعت ============ */
.clock {
position: fixed; top: 15px; left: 15px;
background: #1a1a1a; border: 1px solid #d4af37;
color: #d4af37; padding: 8px 15px; border-radius: 20px;
font-size: 14px; font-weight: bold; z-index: 100;
}

/* ============ سایت ============ */
.container { max-width: 500px; margin: 0 auto; padding: 20px; }
.top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; margin-bottom: 30px; margin-top: 40px; }
.account-btn { background: #1a1a1a; border: 1px solid #d4af37; color: #d4af37; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; }
.header { text-align: center; padding: 30px 0 50px; animation: fadeIn 1s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.title { font-family: 'Cinzel', serif; font-size: 40px; font-weight: 900; color: #d4af37; letter-spacing: 4px; text-shadow: 0 0 20px rgba(212, 175, 55, 0.5); margin-bottom: 15px; }
.subtitle { color: #888; font-size: 16px; margin-top: 15px; }

/* ============ آمار ============ */
.stats { display: flex; gap: 10px; margin-bottom: 30px; }
.stat-box { flex: 1; background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 15px; text-align: center; }
.stat-number { color: #d4af37; font-size: 20px; font-weight: bold; }
.stat-label { color: #888; font-size: 12px; margin-top: 5px; }

.btn { display: block; width: 100%; padding: 20px; background: linear-gradient(135deg, #d4af37, #f4cf5e); color: #000; border-radius: 12px; font-size: 18px; font-weight: bold; text-decoration: none; text-align: center; margin-bottom: 40px; transition: 0.3s; }
.btn:hover { transform: scale(1.02); box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4); }
.links { border-top: 1px solid #222; padding-top: 20px; }
.links a { display: block; color: #d4af37; text-decoration: none; padding: 18px 15px; font-size: 16px; border-bottom: 1px solid #1a1a1a; transition: 0.3s; }
.links a:hover { background: #1a1a1a; padding-right: 25px; }

.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; }
.modal.active { display: flex; align-items: center; justify-content: center; }
.modal-content { background: #1a1a1a; border: 1px solid #333; border-radius: 20px; padding: 30px; width: 90%; max-width: 400px; }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #333; padding-bottom: 15px; }
.modal-title { color: #d4af37; font-size: 20px; }
.close-btn { background: none; border: none; color: #666; font-size: 24px; cursor: pointer; }
.info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #222; }
.info-label { color: #888; }
.info-value { color: #fff; font-weight: bold; }
.login-btn { display: block; width: 100%; padding: 15px; background: #d4af37; color: #000; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
</style>
</head>
<body>

<!-- ساعت -->
<div class="clock" id="clock">۰۰:۰۰:۰۰</div>

<!-- اسپلش -->
<div class="splash" id="splash">
<div class="particles">
<div class="particle"></div><div class="particle"></div><div class="particle"></div>
<div class="particle"></div><div class="particle"></div><div class="particle"></div>
<div class="particle"></div><div class="particle"></div><div class="particle"></div>
</div>
<div class="splash-logo">⚜️</div>
<div class="splash-title">WORLD WAR</div>
<div class="splash-subtitle">در حال آماده‌سازی...</div>
<div class="splash-percent" id="percent">۰٪</div>
</div>

<!-- سایت -->
<div class="container">
<div class="top-bar">
<div></div>
<button class="account-btn" onclick="openAccount()">👤</button>
</div>

<div class="header">
<div class="title">WORLD WAR</div>
<div class="subtitle">به میدان جنگ خوش اومدی</div>
</div>

<!-- آمار -->
<div class="stats">
<div class="stat-box">
<div class="stat-number" id="userCount">۰</div>
<div class="stat-label">👥 کاربران</div>
</div>
<div class="stat-box">
<div class="stat-number" id="gameCount">۰</div>
<div class="stat-label">⚔️ بازی‌ها</div>
</div>
<div class="stat-box">
<div class="stat-number" id="onlineCount">۰</div>
<div class="stat-label">🟢 آنلاین</div>
</div>
</div>

<a href="https://ble.ir/worldwar2037bot" class="btn">🤖 ورود به ربات</a>

<div class="links">
<a href="https://ble.ir/worldwar2037">💬 گپ رسمی</a>
<a href="https://ble.ir/worldwar2036">📢 کانال رسمی</a>
<a href="https://ble.ir/MohammadMahdi2037">📞 پشتیبانی</a>
</div>
</div>

<!-- مودال حساب -->
<div class="modal" id="accountModal">
<div class="modal-content">
<div class="modal-header">
<div class="modal-title">👤 حساب کاربری</div>
<button class="close-btn" onclick="closeAccount()">✖️</button>
</div>
<div class="info-row"><span class="info-label">نام:</span><span class="info-value">---</span></div>
<div class="info-row"><span class="info-label">سطح:</span><span class="info-value">۱</span></div>
<div class="info-row"><span class="info-label">اعتبار:</span><span class="info-value">۰ تومان</span></div>
<button class="login-btn">ورود / ثبت‌نام</button>
</div>
</div>

<script>
// ============ اسپلش ============
let percent = 0;
const percentEl = document.getElementById('percent');
const interval = setInterval(() => {
percent += 2;
if (percent >= 100) { percent = 100; clearInterval(interval); }
percentEl.innerText = percent + '٪';
}, 40);
setTimeout(() => {
document.getElementById('splash').classList.add('hide');
}, 2000);

// ============ ساعت زنده ============
function updateClock() {
const now = new Date();
const h = String(now.getHours()).padStart(2, '0');
const m = String(now.getMinutes()).padStart(2, '0');
const s = String(now.getSeconds()).padStart(2, '0');
document.getElementById('clock').innerText = h + ':' + m + ':' + s;
}
setInterval(updateClock, 1000);
updateClock();

// ============ آمار زنده ============
let users = 0, games = 0, online = 0;
function animateStats() {
const targetUsers = 20;
const targetGames = 150;
const targetOnline = 5;
const interval = setInterval(() => {
if (users < targetUsers) users++;
if (games < targetGames) games += 5;
if (online < targetOnline) online++;
document.getElementById('userCount').innerText = users;
document.getElementById('gameCount').innerText = games;
document.getElementById('onlineCount').innerText = online;
if (users >= targetUsers && games >= targetGames && online >= targetOnline) {
clearInterval(interval);
}
}, 50);
}
setTimeout(animateStats, 2000);

// ============ حساب ============
function openAccount() { document.getElementById('accountModal').classList.add('active'); }
function closeAccount() { document.getElementById('accountModal').classList.remove('active'); }
</script>
</body>
</html>
