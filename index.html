<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚜️WORLD WAR⚜️</title>
    <style>
        /* تنظیمات کلی */
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            background-image: radial-gradient(circle at top, #1a202c 0%, #0d1117 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            padding: 40px 25px;
            width: 90%;
            max-width: 400px;
            background: rgba(22, 27, 34, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            box-sizing: border-box;
        }

        /* لوگو و متن */
        .logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #d4af37;
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
        }

        h1 {
            color: #d4af37;
            font-size: 1.9rem;
            margin: 10px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        p {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #8b949e;
            margin-bottom: 35px;
        }

        /* خط جداکننده (اختیاری برای زیبایی) */
        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(212, 175, 55, 0.2), transparent);
            margin: 30px 0 25px 0;
        }

        /* منوی کپسولی شیشه‌ای */
        .glass-menu {
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }

        /* دکمه‌های کپسولی */
        .btn-capsule {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 10px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            color: #e6edf3;
            text-decoration: none;
            border-radius: 50px; /* این باعث میشه کپسولی بشه */
            cursor: pointer;
            
            /* افکت شیشه‌ای (Glassmorphism) */
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        /* افکت هاور (وقتی انگشت روی دکمه میره) */
        .btn-capsule:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(212, 175, 55, 0.5); /* حاشیه طلایی میشه */
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .btn-capsule span {
            font-size: 1.3rem;
        }

    </style>
</head>
<body>

    <div class="container">
        <!-- لوگوی بازی -->
        <img src="https://i.imgur.com/your-logo.png" alt="World War Logo" class="logo" onerror="this.src='https://via.placeholder.com/120?text=WW'">
        
        <h1>جنگ جهانی</h1>
        <p>فرماندهی را به دست بگیر! ارتش خود را بساز، منابع جمع کن و در نبردهای جهانی پیروز شو. آیا آماده‌ای؟</p>
        
        <div class="divider"></div>

        <!-- منوی کپسولی شیشه‌ای پایین -->
        <div class="glass-menu">
            
            <!-- دکمه خرید آیتم -->
            <a href="#" class="btn-capsule">
                <span>🏪</span>
                خرید آیتم
            </a>

            <!-- دکمه پروفایل -->
            <a href="#" class="btn-capsule">
                <span>🪪</span>
                پروفایل
            </a>

        </div>
    </div>

</body>
</html>
