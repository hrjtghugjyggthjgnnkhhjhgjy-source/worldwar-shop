<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚜️ WORLD WAR | فروشگاه فرماندهان</title>
<link rel="icon" href="https://hrjtghugjyggthjgnnkhhjhgjy-source.github.io/worldwar-shop/images/war-logo.jpg">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, sans-serif; }

  body {
    min-height: 100vh;
    background: #0b0b0d;
    color: #d8d8d8;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px 50px;
  }

  /* ===== نوار ساعت بالا ===== */
  .top-bar {
    width: 100%;
    max-width: 460px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.82rem;
    color: #8a8a8a;
    margin-bottom: 35px;
  }
  .top-bar .clock { font-weight: bold; letter-spacing: 1px; color: #b89446; }

  /* ===== لوگو (ملایم، بدون درخشش شدید) ===== */
  .logo-wrap {
    width: 170px;
    height: 170px;
    border-radius: 50%;
    border: 1.5px solid #4a3d1f;
    overflow: hidden;
    margin-bottom: 28px;
    background: #141414;
  }
  .logo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0.92;
  }

  /* ===== عنوان ===== */
  h1 {
    font-size: 1.7rem;
    color: #c9a84c;
    font-weight: 600;
    letter-spacing: 3px;
    margin-bottom: 10px;
    text-align: center;
  }
  .subtitle {
    font-size: 0.95rem;
    color: #8a8a8a;
    margin-bottom: 38px;
    text-align: center;
    line-height: 1.7;
  }

  /* ===== دکمه ربات (اصلی) ===== */
  .btn-bot-main {
    width: 100%;
    max-width: 420px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 16px 30px;
    background: #c9a84c;
    color: #0b0b0d;
    font-weight: bold;
    font-size: 1.05rem;
    border-radius: 12px;
    text-decoration: none;
    transition: background 0.25s ease;
    margin-bottom: 40px;
  }
  .btn-bot-main:hover {
    background: #ddb95c;
  }

  /* ===== لینک‌های منو ===== */
  .menu {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .menu a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 20px;
    background: #141416;
    border: 1px solid #232326;
    border-radius: 12px;
    color: #cfcfcf;
    text-decoration: none;
    font-size: 0.98rem;
    transition: border-color 0.25s ease, background 0.25s ease;
  }
  .menu a:hover {
    border-color: #4a3d1f;
    background: #1a1a1d;
  }
  .menu a .label { display: flex; align-items: center; gap: 10px; }
  .menu a .arrow { color: #6b5a2a; font-size: 1.1rem; }

  /* ===== فوتر ===== */
  footer {
    margin-top: 45px;
    font-size: 0.78rem;
    color: #555;
    text-align: center;
  }

  @media (max-width: 480px) {
    .logo-wrap { width: 140px; height: 140px; }
    h1 { font-size: 1.35rem; letter-spacing: 2px; }
    .subtitle { font-size: 0.88rem; margin-bottom: 30px; }
    .btn-bot-main { font-size: 1rem; padding: 15px 20px; }
  }
</style>
</head>
<body>

  <div class="top-bar">
    <span>👤 فرمانده</span>
    <span class="clock" id="clock">--:--:--</span>
  </div>

  <div class="logo-wrap">
    <img src="https://hrjtghugjyggthjgnnkhhjhgjy-source.github.io/worldwar-shop/images/war-logo.jpg" alt="World War Logo">
  </div>

  <h1>WORLD WAR</h1>
  <p class="subtitle">فروشگاه فرماندهان — به میدان جنگ خوش اومدی</p>

  <a href="https://t.me/YourBot" class="btn-bot-main" target="_blank">
    🤖 ورود به ربات
  </a>

  <nav class="menu">
    <a href="https://t.me/YourGroup" target="_blank">
      <span class="label">💬 گپ رسمی</span>
      <span class="arrow">‹</span>
    </a>
    <a href="https://t.me/YourChannel" target="_blank">
      <span class="label">📢 کانال رسمی</span>
      <span class="arrow">‹</span>
    </a>
    <a href="https://t.me/YourSupport" target="_blank">
      <span class="label">📞 پشتیبانی</span>
      <span class="arrow">‹</span>
    </a>
  </nav>

  <footer>
    © 2025 World War Shop — تمامی حقوق محفوظ است.
  </footer>

  <script>
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${h}:${m}:${s}`;
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>

</body>
</html>
