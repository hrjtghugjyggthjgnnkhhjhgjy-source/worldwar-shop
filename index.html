<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World War | جنگ جهانی</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            background-color: #0b0e14;
            color: #c9d1d9;
            background-image: radial-gradient(circle at top, #1a202c 0%, #0b0e14 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 100px; 
            box-sizing: border-box;
        }

        /* کارت اصلی وسط */
        .container {
            text-align: center;
            padding: 40px 25px;
            width: 90%;
            max-width: 400px;
            background: rgba(22, 27, 34, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            box-sizing: border-box;
        }

        .logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #d4af37;
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
        }

        h1 {
            color: #d4af37;
            font-size: 1.9rem;
            margin: 10px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            direction: ltr; /* برای اینکه آیکون های گل سمت درست باشن */
        }

        p {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #8b949e;
            margin-bottom: 20px;
        }

        /* ------------------ منوی پایین ------------------ */
        .bottom-nav {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 420px;
            
            /* استایل شیشه‌ای */
            background: rgba(15, 23, 42, 0.7); 
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50px; 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 15px;
            box-sizing: border-box;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #8b949e;
            font-size: 0.75rem;
            font-weight: 700;
            transition: all 0.3s ease;
            width: 65px;
        }

        .nav-item .icon {
            font-size: 1.4rem;
            margin-bottom: 4px;
        }

        /* استایل دکمه فعال (خرید آیتم) */
        .nav-item.active {
            color: #fff;
        }

        .nav-item.active .icon {
            background: #1d4ed8; /* آبی */
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(29, 78, 216, 0.7); /* هاله آبی */
            margin-top: -25px; /* بیرون زدگی */
            border: 3px solid #0b0e14; /* حاشیه هم رنگ پس زمینه */
        }

    </style>
</head>
<body>

    <div class="container">
        <!-- لوگو -->
        <img src="https://i.imgur.com/your-logo.png" alt="WW" class="logo" onerror="this.src='https://via.placeholder.com/120?text=WW'">
        
        <!-- تایتل دقیقا مثل عکس -->
        <h1>⚜️WORLD WAR⚜️</h1>
        
        <p></p>
    </div>

    <!-- منوی پایین شبیه عکس جدیدت -->
    <nav class="bottom-nav">
        
        <!-- سایر -->
        <a href="#" class="nav-item">
            <span class="icon">📁</span>
            سایر
        </a>

        <!-- تنظیمات -->
        <a href="#" class="nav-item">
            <span class="icon">⚙️</span>
            تنظیمات
        </a>

        <!-- پروفایل -->
        <a href="#" class="nav-item">
            <span class="icon">🪪</span>
            پروفایل
        </a>

        <!-- خرید آیتم (فعال) -->
        <a href="#" class="nav-item active">
            <span class="icon">🏪</span>
            خرید آیتم
        </a>

    </nav>

</body>
</html>
