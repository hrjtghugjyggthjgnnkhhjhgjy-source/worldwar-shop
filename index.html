<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World War | جنگ جهانی</title>
    <style>
        /* تنظیمات کلی */
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            background-image: linear-gradient(rgba(13, 17, 23, 0.9), rgba(13, 17, 23, 0.9)), url('https://images.unsplash.com/photo-1534088568595-a066f410cbda?q=80&w=1920'); /* عکس پس‌زمینه جنگی */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 500px;
            background: rgba(22, 27, 34, 0.85);
            border: 1px solid #30363d;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
        }

        .logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #d4af37; /* طلایی */
            object-fit: cover;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        h1 {
            color: #d4af37;
            font-size: 2rem;
            margin: 10px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #8b949e;
            margin-bottom: 30px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #b91c1c, #7f1d1d); /* قرمز جنگی */
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(185, 28, 28, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(185, 28, 28, 0.6);
        }

        .features {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
            border-top: 1px solid #30363d;
            padding-top: 20px;
        }

        .feature-item {
            text-align: center;
            font-size: 0.9rem;
        }
        
        .feature-item span {
            display: block;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- لوگوی بازی (لینک عکست رو بذار) -->
        <img src="https://i.imgur.com/your-logo.png" alt="World War Logo" class="logo" onerror="this.src='https://via.placeholder.com/120?text=WW'">
        
        <h1>جنگ جهانی</h1>
        <p>فرماندهی را به دست بگیر! ارتش خود را بساز، منابع جمع کن و در نبردهای جهانی پیروز شو. آیا آماده‌ای؟</p>
        
        <!-- لینک ورود به ربات تلگرام -->
        <a href="https://t.me/YOUR_BOT_USERNAME" class="btn">🎖️ ورود به میدان نبرد</a>

        <div class="features">
            <div class="feature-item">
                <span>⚔️</span>
                نبردها
            </div>
            <div class="feature-item">
                <span>🛡️</span>
                ارتش
            </div>
            <div class="feature-item">
                <span>💰</span>
                اقتصاد
            </div>
        </div>
    </div>

</body>
</html>
