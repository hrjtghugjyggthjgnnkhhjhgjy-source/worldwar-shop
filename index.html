<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World War | جنگ جهانی</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            background-color: #0b0e14;
            color: #c9d1d9;
            background-image: radial-gradient(circle at top, #1a202c 0%, #0b0e14 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 100px; 
            box-sizing: border-box;
        }

        /* ------------------ هدر بالای صفحه ------------------ */
        .top-header {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: flex-start; /* چیدمان از سمت راست (چون کل سایت rtl هست) */
            align-items: center;
            padding: 20px 15px;
            box-sizing: border-box;
            gap: 12px;
        }

        /* آیکون سمت راست (دقیقا مثل عکس) */
        .header-logo {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            border: 1px solid #d4af37;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #12161f; /* رنگ تیره داخل کادر */
        }

        .header-logo svg {
            width: 30px;
            height: 30px;
            color: #d4af37;
        }

        /* بخش متن‌ها */
        .header-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .header-title {
            color: #ffffff;
            font-size: 1.3rem;
            font-weight: 900;
            margin: 0;
            line-height: 1.2;
            letter-spacing: 1px;
        }

        .header-subtitle {
            color: #8b949e;
            font-size: 0.8rem;
            margin: 4px 0 0 0;
        }

        /* ------------------ کانتینر اصلی ------------------ */
        .container {
            text-align: center;
            padding: 40px 25px;
            width: 90%;
            max-width: 400px;
            background: rgba(22, 27, 34, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            box-sizing: border-box;
            margin-top: 10px;
        }

        .logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #d4af37;
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
        }

        h1 {
            color: #d4af37;
            font-size: 1.9rem;
            margin: 10px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            direction: ltr;
        }

        p {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #8b949e;
            margin-bottom: 20px;
        }

        /* ------------------ منوی پایین ------------------ */
        .bottom-nav {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 420px;
            background: rgba(16, 24, 40, 0.9); 
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 50px; 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 5px;
            box-sizing: border-box;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #8b949e;
            font-size: 0.7rem;
            font-weight: 700;
            transition: all 0.3s ease;
            width: 60px;
            cursor: pointer;
        }

        .nav-icon {
            width: 22px;
            height: 22px;
            margin-bottom: 5px;
            transition: all 0.3s ease;
        }

        .nav-item.active {
            color: #ffffff;
        }

        .nav-item.active .nav-icon {
            color: #ffffff;
            transform: scale(1.1);
        }

    </style>
</head>
<body>

    <!-- هدر بالای صفحه (سمت راست) -->
    <div class="top-header">
        <!-- آیکون دقیقا شبیه عکسی که فرستادی -->
        <div class="header-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 8A6 6 0 0 1 12 18"></path>
                <path d="M8 16A6 6 0 0 1 12 6"></path>
                <circle cx="18" cy="6" r="1.5"></circle>
                <circle cx="6" cy="18" r="1.5"></circle>
                <circle cx="12" cy="12" r="2.5"></circle>
            </svg>
        </div>
        
        <div class="header-text">
            <h1 class="header-title">⚜️ WORLD WAR ⚜️</h1>
            <p class="header-subtitle">ویرایش سایت</p>
        </div>
    </div>

    <!-- محتوای صفحه اصلی -->
    <div class="container" id="main-content">
        <img src="https://i.imgur.com/your-logo.png" alt="WW" class="logo" onerror="this.src='https://via.placeholder.com/120?text=WW'">
        <h1>⚜️ WORLD WAR ⚜️</h1>
        <p>فرماندهی را به دست بگیر! ارتش خود را بساز، منابع جمع کن و در نبردهای جهانی پیروز شو. آیا آماده‌ای؟</p>
    </div>

    <!-- منوی پایین -->
    <nav class="bottom-nav">
        
        <!-- سایر -->
        <a href="#" class="nav-item" onclick="selectTab(this)">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="4" y1="8" x2="20" y2="8"></line>
                <line x1="4" y1="16" x2="20" y2="16"></line>
            </svg>
            سایر
        </a>

        <!-- تنظیمات -->
        <a href="#" class="nav-item" onclick="selectTab(this)">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            تنظیمات
        </a>

        <!-- پروفایل -->
        <a href="#" class="nav-item" onclick="selectTab(this)">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
            پروفایل
        </a>

        <!-- خرید آیتم -->
        <a href="#" class="nav-item" onclick="selectTab(this)">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            خرید آیتم
        </a>

        <!-- منو اصلی -->
        <a href="#" class="nav-item active" onclick="selectTab(this)">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            منو اصلی
        </a>

    </nav>

    <script>
        function selectTab(element) {
            const items = document.querySelectorAll('.nav-item');
            items.forEach(item => item.classList.remove('active'));
            element.classList.add('active');
        }
    </script>

</body>
</html>
