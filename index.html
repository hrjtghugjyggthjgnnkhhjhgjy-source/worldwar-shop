<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World War</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            background-color: #0b111e; /* رنگ پس زمینه اصلی */
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 100px; 
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* ------------------ بنر جنگنده (بدون خط زرد و روشن تر) ------------------ */
        .hero-banner {
            width: 100%;
            max-width: 500px;
            height: auto; 
            aspect-ratio: 21 / 9; 
            
            background-color: #0b111e; 
            background-image: url('https://uploadkon.ir/uploads/5e4d23_26file-00000000922c8246908a4987443fcf6c.png'); 
            
            background-size: contain; 
            background-position: center;
            background-repeat: no-repeat;
            
            /* 👇 حذف خط زرد (بوردر) */
            border-bottom: none; 
            
            /* 👇 روشن تر کردن عکس و شفافیت بیشتر */
            filter: brightness(1.15) contrast(1.1); 
        }

        /* ------------------ کارت پروفایل ------------------ */
        .profile-card {
            width: 90%; max-width: 460px; background: #151d2c;
            border: 1px solid rgba(255, 255, 255, 0.08); /* خط دور کارت ملایم تر */
            border-radius: 16px;
            margin-top: 20px; display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); /* سایه برای عمق دادن */
        }
        .profile-top { display: flex; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .info-right { flex: 2; padding: 20px; display: flex; flex-direction: column; justify-content: center; }
        .info-label { color: #8b949e; font-size: 0.8rem; display: flex; align-items: center; gap: 5px; margin-bottom: 5px; }
        .info-label svg { width: 16px; height: 16px; color: #d4af37; }
        .info-value { color: #ffffff; font-size: 1.1rem; font-weight: 900; margin: 0; }
        .info-left { flex: 1; border-right: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .level-number { color: #ffffff; font-size: 1.8rem; font-weight: 900; }
        .profile-bottom { padding: 20px; display: flex; flex-direction: column; align-items: flex-start; }

        /* ------------------ منوی پایین ------------------ */
        .bottom-nav {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 95%; max-width: 460px; background: #151d2c;
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 50px; backdrop-filter: blur(20px);
            display: flex; justify-content: space-around; align-items: center; padding: 10px 5px; z-index: 1000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #8b949e; font-size: 0.7rem; font-weight: 700; width: 60px; cursor: pointer; }
        .nav-icon { width: 22px; height: 22px; margin-bottom: 5px; }
        .nav-item.active { color: #ffffff; }

    </style>
</head>
<body>

    <!-- بنر جنگنده -->
    <div class="hero-banner"></div>

    <!-- کارت پروفایل -->
    <div class="profile-card">
        <div class="profile-top">
            <div class="info-right">
                <div class="info-label">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    فرمانده
                </div>
                <p class="info-value" id="user-name">در حال دریافت...</p>
            </div>
            <div class="info-left">
                <div class="info-label">سطح</div>
                <div class="level-number">۲۱</div>
            </div>
        </div>
        <div class="profile-bottom">
            <div class="info-label">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                اعتبار
            </div>
            <p class="info-value">۰ تومان</p>
        </div>
    </div>

    <!-- منوی پایین -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="4" y1="8" x2="20" y2="8"></line><line x1="4" y1="16" x2="20" y2="16"></line></svg>سایر</a>
        <a href="#" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>تنظیمات</a>
        <a href="#" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>پروفایل</a>
        <a href="#" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>خرید آیتم</a>
        <a href="#" class="nav-item active"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>منو اصلی</a>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        
        tg.setHeaderColor('#0b111e'); 
        tg.setBackgroundColor('#0b111e');

        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-name').innerText = user.first_name;
        }
    </script>

</body>
</html>
