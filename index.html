<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚜️ WORLD WAR | فروشگاه فرماندهان</title>
<link rel="icon" href="https://hrjtghugjyggthjgnnkhhjhgjy-source.github.io/worldwar-shop/images/war-logo.jpg">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, sans-serif; }

  body {
    min-height: 100vh;
    background:
      radial-gradient(circle at 50% 20%, rgba(212,175,55,0.18), transparent 60%),
      linear-gradient(rgba(0,0,0,0.88), rgba(0,0,0,0.96)),
      url('https://hrjtghugjyggthjgnnkhhjhgjy-source.github.io/worldwar-shop/images/war-logo.jpg') center/cover fixed no-repeat;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px 50px;
    overflow-x: hidden;
  }

  /* ===== نوار ساعت بالا ===== */
  .top-bar {
    width: 100%;
    max-width: 500px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    color: #d4af37;
    margin-bottom: 20px;
  }
  .top-bar .clock { font-weight: bold; letter-spacing: 1px; }
  .top-bar .user { opacity: 0.8; }

  /* ===== لوگو ===== */
  .logo-wrap {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    border: 3px solid #d4af37;
    box-shadow:
      0 0 30px rgba(212,175,55,0.6),
      0 0 70px rgba(212,175,55,0.3);
    overflow: hidden;
    animation: glow 3s ease-in-out infinite alternate;
    margin-bottom: 25px;
  }
  .logo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  @keyframes glow {
    from { box-shadow: 0 0 25px rgba(212,175,55,0.5), 0 0 60px rgba(212,175,55,0.2); }
    to   { box-shadow: 0 0 45px rgba(212,175,55,0.9), 0 0 100px rgba(212,175,55,0.4); }
  }

  /* ===== عنوان ===== */
  h1 {
    font-size: 2rem;
    color: #d4af37;
    text-shadow: 0 0 20px rgba(212,175,55,0.6), 2px 2px 4px #000;
    letter-spacing: 3px;
    margin-bottom: 8px;
    text-align: center;
  }
  .subtitle {
    font-size: 1.05rem;
    color: #bbb;
    margin-bottom: 30px;
    text-align: center;
  }

  /* ===== دکمه ربات (اصلی) ===== */
  .btn-bot-main {
    width: 100%;
    max-width: 420px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 18px 30px;
    background: linear-gradient(135deg, #d4af37, #b8860b);
    color: #0a0a0a;
    font-weight: bold;
    font-size: 1.15rem;
    border-radius: 50px;
    text-decoration: none;
    box-shadow: 0 0 30px rgba(212,175,55,0.6);
    transition: 0.3s;
    margin-bottom: 35px;
  }
  .btn-bot-main:hover {
    background: linear-gradient(135deg, #ffd700, #d4af37);
    transform: translateY(-3px);
    box-shadow: 0 0 45px rgba(255,215,0,0.9);
  }

  /* ===== لینک‌های منو ===== */
  .menu {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .menu a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 22px;
    background: rgba(20,20,20,0.85);
    border: 1px solid #3a2f10;
    border-radius: 14px;
    color: #e8e8e8;
    text-decoration: none;
    font-size: 1.05rem;
    font-weight: bold;
    transition: 0.3s;
    backdrop-filter: blur(8px);
  }
  .menu a:hover {
    border-color: #d4af37;
    background: rgba(40,33,10,0.9);
    transform: translateX(-5px);
    box-shadow: 0 0 20px rgba(212,175,55,0.3);
  }
  .menu a .label { display: flex; align-items: center; gap: 10px; }
  .menu a .arrow { color: #d4af37; font-size: 1.3rem; }

  /* ===== فوتر ===== */
  footer {
    margin-top: 45px;
    font-size: 0.85rem;
    color: #666;
    text-align: center;
  }
  footer span { color: #d4af37; }

  @media (max-width: 480px) {
    .logo-wrap { width: 170px; height: 170px; }
    h1 { font-size: 1.5rem; letter-spacing: 2px; }
    .subtitle { font-size: 0.95rem; }
    .btn-bot-main { font-size: 1rem; padding: 16px 20px; }
  }
</style>
</head>
<body>

  <!-- نوار بالا: ساعت و کاربر -->
  <div class="top-bar">
    <span class="user">👤 فرمانده</span>
    <span class="clock" id="clock">--:--:--</span>
  </div>

  <!-- لوگو -->
  <div class="logo-wrap">
    <img src="https://hrjtghugjyggthjgnnkhhjhgjy-source.github.io/worldwar-shop/images/war-logo.jpg" alt="World War Logo">
  </div>

  <!-- عنوان -->
  <h1>⚜️ WORLD WAR ⚜️</h1>
  <p class="subtitle">فروشگاه فرماندهان — به میدان جنگ خوش اومدی</p>

  <!-- دکمه ربات -->
  <a href="https://t.me/YourBot" class="btn-bot-main" target="_blank">
    🤖 ورود به ربات
  </a>

  <!-- منوی لینک‌ها -->
  <nav class="menu">
    <a href="https://t.me/YourGroup" target="_blank">
      <span class="label">💬 گپ رسمی</span>
      <span class="arrow">‹</span>
    </a>
    <a href="https://t.me/YourChannel" target="_blank">
      <span class="label">📢 کانال رسمی</span>
      <span class="arrow">‹</span>
    </a>
    <a href="https://t.me/YourSupport" target="_blank">
      <span class="label">📞 پشتیبانی</span>
      <span class="arrow">‹</span>
    </a>
  </nav>

  <footer>
    © 2025 <span>World War Shop</span> — تمامی حقوق محفوظ است.
  </footer>

  <!-- ساعت زنده -->
  <script>
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${h}:${m}:${s}`;
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>

</body>
</html>
