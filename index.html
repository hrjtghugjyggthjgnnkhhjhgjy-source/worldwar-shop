<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World War</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            background-color: #060910; 
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 100px; 
            box-sizing: border-box;
            overflow-x: hidden;
            
            /* قوانین طلایی: جلوگیری از کپی و حذف هایلایت */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent; 
        }

        /* بنر جنگنده (ثابت در همه صفحات) */
        .hero-banner {
            width: 100%; max-width: 500px; aspect-ratio: 21 / 9; 
            background-color: #060910; 
            background-image: url('https://uploadkon.ir/uploads/5e4d23_26file-00000000922c8246908a4987443fcf6c.png'); 
            background-size: contain; background-position: center; background-repeat: no-repeat;
            border: none; 
        }

        /* ------------------ استایل صفحات ------------------ */
        .page-section {
            width: 90%; max-width: 460px;
            display: none; /* همه صفحات مخفی هستن */
            animation: fadeIn 0.3s ease-in-out;
            margin-top: 20px;
        }

        .page-section.active-page {
            display: block; /* فقط صفحه فعال نمایش داده میشه */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ------------------ کارت پروفایل (منو اصلی) ------------------ */
        .profile-card {
            width: 100%; background: #0d121c; border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px; display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6); 
        }
        .profile-top { display: flex; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .info-right { flex: 2; padding: 20px; display: flex; flex-direction: column; justify-content: center; }
        .info-label { color: #8b949e; font-size: 0.8rem; display: flex; align-items: center; gap: 5px; margin-bottom: 5px; }
        .info-label svg { width: 16px; height: 16px; color: #d4af37; }
        .info-value { color: #ffffff; font-size: 1.1rem; font-weight: 900; margin: 0; }
        .info-left { flex: 1; border-right: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .level-number { color: #ffffff; font-size: 1.8rem; font-weight: 900; }
        
        .profile-bottom { padding: 20px; display: flex; flex-direction: column; }
        .wallet-title { color: #8b949e; font-size: 0.85rem; margin-bottom: 15px; display: flex; align-items: center; gap: 5px; }
        .wallet-title svg { width: 16px; height: 16px; color: #d4af37; }

        .resources-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .resource-box {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px; padding: 12px 5px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
        }
        .resource-box .icon { font-size: 1.2rem; }
        .resource-box .amount { color: #ffffff; font-weight: 900; font-size: 0.95rem; }
        .resource-box .name { color: #8b949e; font-size: 0.7rem; }

        /* ------------------ صفحه سایر (دکمه‌های گرید) ------------------ */
        .other-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .other-btn {
            background: #0d121c;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 25px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .other-btn:hover {
            border-color: #d4af37;
            background: rgba(212, 175, 55, 0.05);
        }

        .other-btn .emoji { font-size: 2.5rem; margin-bottom: 15px; }
        .other-btn .title { font-size: 0.95rem; font-weight: bold; }

        /* ------------------ منوی پایین ------------------ */
        .bottom-nav {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 95%; max-width: 460px; background: rgba(13, 18, 28, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 50px; backdrop-filter: blur(20px);
            display: flex; justify-content: space-around; align-items: center; padding: 12px 5px; z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        
        .nav-item { 
            display: flex; flex-direction: column; align-items: center; 
            color: #8b949e; font-size: 0.7rem; font-weight: 700; width: 60px; 
            cursor: pointer; transition: all 0.3s ease;
        }
        
        .nav-icon { width: 24px; height: 24px; margin-bottom: 5px; transition: all 0.3s ease; }
        
        .nav-item.active { color: #ffffff; }
        .nav-item.active .nav-icon { color: #ffffff; transform: scale(1.1); }

    </style>
</head>
<body>

    <!-- بنر جنگنده -->
    <div class="hero-banner"></div>

    <!-- ================= صفحه 1: منو اصلی (کارت پروفایل) ================= -->
    <div id="page-main" class="page-section active-page">
        <div class="profile-card">
            <div class="profile-top">
                <div class="info-right">
                    <div class="info-label">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        فرمانده
                    </div>
                    <p class="info-value" id="user-name">در حال دریافت...</p>
                </div>
                <div class="info-left">
                    <div class="info-label">سطح</div>
                    <div class="level-number">۲۱</div>
                </div>
            </div>
            <div class="profile-bottom">
                <div class="wallet-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                    موجودی کیف پول
                </div>
                <div class="resources-grid">
                    <div class="resource-box"><span class="icon">💰</span><span class="amount">۵,۰۰۰</span><span class="name">سکه</span></div>
                    <div class="resource-box"><span class="icon">💎</span><span class="amount">۵۰</span><span class="name">جم</span></div>
                    <div class="resource-box"><span class="icon">🛢️</span><span class="amount">۱۲۰</span><span class="name">نفت</span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= صفحه 2: سایر (دکمه‌های گرید) ================= -->
    <div id="page-other" class="page-section">
        <div class="other-grid">
            <!-- کانال بله -->
            <a href="#" class="other-btn">
                <span class="emoji">💙</span>
                <span class="title">کانال بله</span>
            </a>
            <!-- پشتیبانی -->
            <a href="#" class="other-btn">
                <span class="emoji">💬</span>
                <span class="title">پشتیبانی</span>
            </a>
            <!-- قوانین و راهنما -->
            <a href="#" class="other-btn">
                <span class="emoji">📋</span>
                <span class="title">قوانین و راهنما</span>
            </a>
            <!-- گروه گفتگو -->
            <a href="#" class="other-btn">
                <span class="emoji">👥</span>
                <span class="title">گروه گفتگو</span>
            </a>
            <!-- کانال روبیکا -->
            <a href="#" class="other-btn">
                <span class="emoji">🟣</span>
                <span class="title">کانال روبیکا</span>
            </a>
        </div>
    </div>

    <!-- ================= منوی پایین ================= -->
    <nav class="bottom-nav">
        
        <!-- 1. سایر -->
        <div class="nav-item" onclick="switchPage('other', this)">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <line x1="4" y1="6" x2="20" y2="6"></line>
                <line x1="4" y1="12" x2="20" y2="12"></line>
                <line x1="4" y1="18" x2="20" y2="18"></line>
            </svg>
            سایر
        </div>

        <!-- 2. تنظیمات -->
        <div class="nav-item" onclick="switchPage('settings', this)">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            تنظیمات
        </div>

        <!-- 3. فروشگاه -->
        <div class="nav-item" onclick="switchPage('shop', this)">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            فروشگاه
        </div>

        <!-- 4. خرید آیتم -->
        <div class="nav-item" onclick="switchPage('buy', this)">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path></svg>
            خرید آیتم
        </div>

        <!-- 5. منو اصلی -->
        <div class="nav-item active" onclick="switchPage('main', this)">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            منو اصلی
        </div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        tg.setHeaderColor('#060910'); 
        tg.setBackgroundColor('#060910');

        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-name').innerText = user.first_name;
        }

        // ------------------ تابع تغییر صفحات ------------------
        function switchPage(pageName, element) {
            // ۱. مخفی کردن همه صفحات
            const pages = document.querySelectorAll('.page-section');
            pages.forEach(page => page.classList.remove('active-page'));

            // ۲. نمایش صفحه درخواستی
            if (pageName === 'main') {
                document.getElementById('page-main').classList.add('active-page');
            } else if (pageName === 'other') {
                document.getElementById('page-other').classList.add('active-page');
            } else {
                // برای بقیه صفحات فعلاً صفحه اصلی باز میشه (چون هنوز طراحیشون نکردیم)
                document.getElementById('page-main').classList.add('active-page');
            }

            // ۳. تغییر رنگ دکمه منوی پایین (سفید شدن)
            const items = document.querySelectorAll('.nav-item');
            items.forEach(item => item.classList.remove('active'));
            element.classList.add('active');
        }
    </script>

</body>
</html>
