<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World War</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, sans-serif; }
body { background: #0a0a0a; color: #fff; min-height: 100vh; padding: 20px; }

/* ============ هدر بالا ============ */
.top-header {
display: flex;
justify-content: space-between;
align-items: center;
padding: 15px 0;
margin-bottom: 40px;
}
.header-right { display: flex; align-items: center; gap: 10px; }
.logo-box {
width: 40px; height: 40px;
background: #1a1a1a;
border: 1px solid #d4af37;
border-radius: 50%;
display: flex; align-items: center; justify-content: center;
font-size: 20px;
color: #d4af37;
}
.brand { display: flex; flex-direction: column; }
.brand-name { color: #fff; font-size: 16px; font-weight: bold; }
.brand-sub { color: #666; font-size: 11px; }
.header-left { display: flex; gap: 10px; }
.icon-btn {
background: #1a1a1a;
border: 1px solid #333;
color: #d4af37;
width: 40px; height: 40px;
border-radius: 50%;
cursor: pointer;
font-size: 18px;
display: flex; align-items: center; justify-content: center;
transition: 0.3s;
}
.icon-btn:hover { border-color: #d4af37; transform: scale(1.1); }
.icon-btn.spinning { animation: spin 0.6s linear; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* ============ محتوا ============ */
.container { max-width: 400px; margin: 0 auto; }
.title {
font-size: 32px;
color: #d4af37;
text-align: center;
margin-bottom: 10px;
letter-spacing: 3px;
text-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
}
.subtitle { color: #666; text-align: center; font-size: 13px; margin-bottom: 50px; }

.btn {
display: block;
width: 100%;
padding: 18px;
background: linear-gradient(135deg, #d4af37, #f4cf5e);
color: #000;
border-radius: 12px;
font-size: 18px;
font-weight: bold;
text-decoration: none;
text-align: center;
margin-bottom: 40px;
transition: 0.3s;
}
.btn:hover { transform: scale(1.02); box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4); }

.links { border-top: 1px solid #1a1a1a; padding-top: 10px; }
.links a {
display: flex;
align-items: center;
justify-content: space-between;
color: #d4af37;
text-decoration: none;
padding: 16px 15px;
font-size: 15px;
border-bottom: 1px solid #1a1a1a;
transition: 0.3s;
}
.links a:hover { background: #1a1a1a; padding-right: 25px; }

/* ============ ساعت پایین ============ */
.clock-bottom {
text-align: center;
color: #333;
font-size: 12px;
margin-top: 40px;
}
</style>
</head>
<body>

<div class="container">

<!-- هدر بالا -->
<div class="top-header">
<div class="header-right">
<div class="logo-box">⚜️</div>
<div class="brand">
<div class="brand-name">WORLD WAR</div>
<div class="brand-sub">فروشگاه فرماندهان</div>
</div>
</div>
<div class="header-left">
<button class="icon-btn" onclick="refreshSite(this)">🔄</button>
<button class="icon-btn" onclick="alert('حساب کاربری')">👤</button>
</div>
</div>

<!-- عنوان -->
<div class="title">⚜️𝐖𝐎𝐑𝐋𝐃 𝐖𝐀𝐑⚜️</div>
<div class="subtitle">به میدان جنگ خوش اومدی</div>

<!-- دکمه اصلی -->
<a href="https://ble.ir/worldwar2037bot" class="btn">🤖 ورود به ربات</a>

<!-- لینک‌ها -->
<div class="links">
<a href="https://ble.ir/worldwar2037"><span>💬 گپ رسمی</span><span>›</span></a>
<a href="https://ble.ir/worldwar2036"><span>📢 کانال رسمی</span><span>›</span></a>
<a href="https://ble.ir/MohammadMahdi2037"><span>📞 پشتیبانی</span><span>›</span></a>
</div>

<!-- ساعت -->
<div class="clock-bottom" id="clock">۰۰:۰۰:۰۰</div>

</div>

<script>
// ============ ساعت ============
function updateClock() {
const now = new Date();
const h = String(now.getHours()).padStart(2, '0');
const m = String(now.getMinutes()).padStart(2, '0');
const s = String(now.getSeconds()).padStart(2, '0');
document.getElementById('clock').innerText = h + ':' + m + ':' + s;
}
setInterval(updateClock, 1000);
updateClock();

// ============ دکمه بروزرسانی ============
function refreshSite(btn) {
btn.classList.add('spinning');
setTimeout(() => {
btn.classList.remove('spinning');
location.reload();
}, 600);
}
</script>
</body>
</html>
